<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sheet 03 · Central Spine &amp; Spaced Parks Plan (2D) — Colony 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #eef2ef;
      --bg-sheet: #ffffff;
      --bg-header: #13221d;
      --bg-header-2: #1c312a;
      --bg-panel: #f7faf8;
      --ink-primary: #13221d;
      --ink-secondary: #3f524a;
      --ink-muted: #61746b;
      --border-hairline: #c7d2cc;
      --border-ink: #1c312a;
      --accent-green: #146c34;
      --accent-green-ink: #0d5226;
      --accent-green-bg: #e8f5ee;
      --accent-ese: #9a5a13;
      --accent-ese-bg: #fbf3e4;
      --accent-nw: #155e75;
      --accent-nw-bg: #e7f2f4;
      --accent-wall: #b83721;
      --font-ui: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Archivo', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 3px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: #146c34; color: #ffffff; }
    :focus-visible { outline: 2px solid #146c34; outline-offset: 2px; }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    .cad-topbar {
      background-color: var(--bg-header);
      color: #f4f7f5;
      border-bottom: 1px solid #263d34;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      background: var(--bg-header-2);
      border: 1px solid #3c544b;
      border-radius: var(--radius);
      color: #e6efea;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .back-link:hover { background: #264037; border-color: #6b8e7e; }

    body.is-embedded .back-link,
    body.is-embedded .sheet-title-wrap {
      display: none;
    }

    .sheet-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sheet-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    .sheet-subtitle {
      font-family: var(--font-mono);
      font-size: 11px;
      color: #b7cbc1;
      font-variant-numeric: tabular-nums;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .filter-strip {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .flt-btn {
      height: 28px;
      padding: 0 8px;
      border-radius: var(--radius);
      border: 1px solid #354c43;
      background: #1a2d26;
      color: #d7e4dd;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .flt-btn:hover { background: #243b33; border-color: #5e7e71; }
    .flt-btn.is-active {
      background: var(--accent-green);
      border-color: #34a862;
      color: #ffffff;
      font-weight: 700;
    }
    .flt-btn[data-filter="ese"].is-active {
      background: #9a5a13;
      border-color: #d9822b;
    }
    .flt-btn[data-filter="nw"].is-active {
      background: #155e75;
      border-color: #318ba8;
    }

    .top-search {
      display: inline-flex;
      align-items: center;
      border: 1px solid #354c43;
      border-radius: var(--radius);
      background: #101e19;
      overflow: hidden;
    }
    .search-input {
      width: 96px;
      height: 26px;
      padding: 0 8px;
      border: none;
      background: transparent;
      color: #eef4f0;
      font-family: var(--font-mono);
      font-size: 11px;
      outline: none;
    }
    .search-input::placeholder { color: #7e968a; }
    .search-go {
      height: 26px;
      padding: 0 9px;
      border: none;
      border-left: 1px solid #354c43;
      background: #1c312a;
      color: #d7e4dd;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .search-go:hover { background: #27443a; color: #ffffff; }

    .zoom-group {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .tool-btn {
      height: 28px;
      padding: 0 9px;
      border: 1px solid #354c43;
      border-radius: var(--radius);
      background: #1a2d26;
      color: #e4ede8;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .tool-btn:hover { background: #264037; border-color: #6b8e7e; }

    .action-btn {
      height: 28px;
      padding: 0 9px;
      border: 1px solid #3c544b;
      border-radius: var(--radius);
      background: var(--bg-header-2);
      color: #e6efea;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .action-btn:hover { background: #264037; border-color: #6b8e7e; }

    .stage-pane {
      flex: 1;
      min-width: 0;
      min-height: 0;
      position: relative;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(#bcc8c1 1px, transparent 1px);
      background-size: 20px 20px;
      padding: 10px;
      display: flex;
      align-items: stretch;
      justify-content: center;
      overflow: hidden;
    }

    .sheet-frame {
      width: 100%;
      height: 100%;
      background-color: var(--bg-sheet);
      border: 1px solid var(--border-ink);
      border-radius: var(--radius);
      box-shadow: 0 2px 10px rgba(19, 34, 29, 0.08);
      position: relative;
      overflow: hidden;
    }

    #cad-svg {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    #cad-svg.is-panning { cursor: grabbing; }

    .zoom-readout {
      position: absolute;
      left: 10px;
      bottom: 10px;
      background: rgba(19, 34, 29, 0.88);
      color: #eef4f0;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 9px;
      border-radius: var(--radius);
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    /* Floating Contextual Detail Card — hidden by default for a minimal canvas */
    .detail-card {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 296px;
      max-width: calc(100% - 36px);
      background: #f7faf8;
      border: 1px solid var(--border-ink);
      border-radius: 4px;
      box-shadow: 0 12px 28px rgba(19, 34, 29, 0.16);
      z-index: 25;
      overflow: hidden;
      transition: opacity 0.14s ease, transform 0.14s ease;
    }
    .detail-card.is-hidden {
      display: none;
    }

    .detail-head {
      background: var(--bg-header);
      color: #ffffff;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .detail-head-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .detail-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
    }
    .detail-close {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      border: 1px solid #3c544b;
      border-radius: var(--radius);
      background: #1c312a;
      color: #e6efea;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .detail-close:hover { background: #2c4a3f; color: #ffffff; }

    .detail-body {
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .insp-tag {
      align-self: flex-start;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius);
      font-variant-numeric: tabular-nums;
    }
    .insp-tag--ok { background: #214e39; color: #c7ecd6; border: 1px solid #3b7f5d; }
    .insp-tag--ese { background: #473014; color: #f6dec0; border: 1px solid #8a5b21; }
    .insp-tag--nw { background: #143946; color: #c4e8f2; border: 1px solid #2b6d83; }
    .insp-tag--road { background: #263932; color: #dbe6e0; border: 1px solid #526b61; }

    .spec-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
    }

    .spec-cell {
      padding: 4px 0 6px 0;
      border-bottom: 1px solid #dde6e1;
    }

    .spec-k {
      font-size: 11px;
      color: var(--ink-muted);
      margin-bottom: 2px;
    }

    .spec-v {
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-primary);
      font-variant-numeric: tabular-nums;
    }

    .detail-note {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-secondary);
      padding-top: 4px;
      border-top: 1px dashed #d0dad5;
    }

    /* SVG Interactive Elements */
    .road-poly {
      cursor: pointer;
      transition: fill 0.12s ease, stroke 0.12s ease;
    }
    .road-poly--main {
      fill: #e2eae5;
      stroke: #9ab0a5;
      stroke-width: 0.6;
    }
    .road-poly--sub {
      fill: #ecf1ee;
      stroke: #b5c5bc;
      stroke-width: 0.5;
    }
    .road-poly:hover {
      fill: #d4e3da;
      stroke: #3f6956;
      stroke-width: 1.2;
    }
    .road-poly.is-selected {
      fill: #c7ded1;
      stroke: #0d5226;
      stroke-width: 1.8;
    }

    .road-median {
      stroke: #5c786c;
      stroke-width: 0.9;
      stroke-dasharray: 8 6;
      fill: none;
      pointer-events: none;
    }
    .road-lbl {
      font-family: var(--font-mono);
      font-size: 5.7px;
      font-weight: 600;
      fill: #2f463d;
      text-anchor: middle;
      letter-spacing: 0.04em;
      paint-order: stroke;
      stroke: #ecf1ee;
      stroke-width: 5.2px;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .road-lbl--main {
      font-size: 6.3px;
      fill: #13221d;
      font-weight: 700;
      stroke: #e2eae5;
      stroke-width: 5.8px;
    }

    .park-poly {
      fill: #d8f0e1;
      stroke: #247844;
      stroke-width: 1.0;
    }
    .park-walk {
      fill: none;
      stroke: #79b890;
      stroke-width: 0.85;
      stroke-dasharray: 3 2.5;
      pointer-events: none;
    }
    .park-plaza {
      fill: #eef8f1;
      fill-opacity: 0.72;
      stroke: #2d7a4f;
      stroke-width: 0.8;
      pointer-events: none;
    }
    .park-tree-outer {
      fill: #9bd6b1;
      fill-opacity: 0.6;
      stroke: #1f6b3d;
      stroke-width: 0.5;
      pointer-events: none;
    }
    .park-tree-core {
      fill: #146c34;
      pointer-events: none;
    }
    .park-title {
      font-family: var(--font-ui);
      font-size: 7.3px;
      font-weight: 700;
      fill: #0d5226;
      text-anchor: middle;
      paint-order: stroke;
      stroke: #d8f0e1;
      stroke-width: 2.6px;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .park-meta {
      font-family: var(--font-mono);
      font-size: 5.7px;
      font-weight: 600;
      fill: #185c37;
      text-anchor: middle;
      paint-order: stroke;
      stroke: #d8f0e1;
      stroke-width: 2.2px;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .cad-park { cursor: pointer; }
    .cad-park:hover .park-poly,
    .cad-park.is-selected .park-poly {
      stroke: #0d5226;
      stroke-width: 2.1;
      fill: #cbead6;
    }

    .cad-plot {
      cursor: pointer;
      transition: opacity 0.14s ease;
    }
    .cad-plot.is-dimmed { opacity: 0.14; }
    .plot-poly { stroke-width: 0.68; }
    .plot-face--ne .plot-poly { fill: #e8f5ee; stroke: #2c7a4b; }
    .plot-face--nw .plot-poly { fill: #e7f2f4; stroke: #246a7d; }
    .plot-face--ese .plot-poly { fill: #fbf3e4; stroke: #a6691e; }
    .cad-plot.is-corner .plot-poly { stroke-width: 0.95; }

    .plot-front-chevron {
      opacity: 0.55;
      pointer-events: none;
    }
    .plot-face--ne .plot-front-chevron { fill: #146c34; }
    .plot-face--nw .plot-front-chevron { fill: #155e75; }
    .plot-face--ese .plot-front-chevron { fill: #9a5a13; }

    .cad-plot:hover .plot-poly {
      stroke-width: 1.8;
      filter: brightness(0.95);
    }
    .cad-plot.is-selected .plot-poly {
      stroke: #13221d;
      stroke-width: 2.4;
      fill: #d2ece0;
    }
    .plot-face--ese.is-selected .plot-poly { fill: #f5dfb8; }
    .plot-face--nw.is-selected .plot-poly { fill: #cde6ec; }

    .plot-lbl { pointer-events: none; }
    .pl-id {
      font-family: var(--font-mono);
      font-size: 5.5px;
      font-weight: 700;
      fill: #13221d;
      text-anchor: middle;
    }
    .pl-gaj {
      font-family: var(--font-mono);
      font-size: 4.5px;
      font-weight: 600;
      fill: #1d3c31;
      text-anchor: middle;
    }
    .pl-dim {
      font-family: var(--font-mono);
      font-size: 3.7px;
      font-weight: 500;
      fill: #475f55;
      text-anchor: middle;
    }

    /* Outer Boundary & Walls */
    .outer-boundary-line {
      fill: none;
      stroke: #13221d;
      stroke-width: 2.2;
      pointer-events: none;
    }
    .wall-barrier {
      fill: none;
      stroke: var(--accent-wall);
      stroke-width: 3.4;
      pointer-events: none;
    }
    .wall-hatch-band {
      fill: url(#closed-wall-hatch);
      opacity: 0.85;
      pointer-events: none;
    }
    .gate-threshold {
      fill: #ecfdf5;
      stroke: #146c34;
      stroke-width: 1.6;
      pointer-events: none;
    }

    .dim-txt {
      font-family: var(--font-mono);
      font-size: 8.5px;
      font-weight: 600;
      fill: #13221d;
      text-anchor: middle;
    }
    .wall-txt {
      font-family: var(--font-mono);
      font-size: 7.4px;
      font-weight: 700;
      fill: #b83721;
      text-anchor: middle;
    }
    .zone-txt {
      font-family: var(--font-mono);
      font-size: 6.6px;
      font-weight: 700;
      fill: #1d4ed8;
      text-anchor: middle;
    }
    .corner-pin-circle { fill: #ffffff; stroke: #13221d; stroke-width: 1.2; }
    .corner-pin-txt {
      font-family: var(--font-mono);
      font-size: 6.5px;
      font-weight: 700;
      fill: #13221d;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .tool-btn.is-active {
      background: var(--accent-green);
      color: #ffffff;
    }

    @media (max-width: 720px) {
      .cad-topbar { padding: 6px 8px; gap: 5px; }
      .topbar-left { width: 100%; justify-content: space-between; gap: 6px; flex-wrap: nowrap; min-width: 0; }
      .back-link { height: 32px; padding: 0 8px; font-size: 11px; flex-shrink: 0; }
      .sheet-title-wrap { min-width: 0; flex: 1 1 auto; }
      .sheet-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sheet-subtitle { display: none; }
      .hide-xs { display: none; }
      .topbar-controls {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 5px;
        align-items: center;
      }
      .filter-strip {
        grid-column: 1 / -1;
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding-bottom: 1px;
      }
      .filter-strip::-webkit-scrollbar { display: none; }
      .flt-btn { height: 34px; padding: 0 10px; font-size: 11px; flex-shrink: 0; }
      .top-search { min-width: 0; width: 100%; }
      .search-input { width: 100%; min-width: 0; height: 34px; font-size: 12px; }
      .search-go { height: 34px; padding: 0 10px; flex-shrink: 0; }
      .zoom-group { gap: 3px; }
      .tool-btn { height: 34px; padding: 0 8px; font-size: 11px; }
      .action-btn { height: 34px; padding: 0 9px; font-size: 11px; }
      .stage-pane { padding: 4px; }
      .zoom-readout {
        left: 6px;
        right: 6px;
        bottom: 6px;
        font-size: 11px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .detail-card {
        top: auto;
        right: 6px;
        left: 6px;
        bottom: max(6px, env(safe-area-inset-bottom, 0px));
        width: auto;
        max-width: none;
        max-height: 46dvh;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .detail-close { width: 36px; height: 36px; font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="cad-topbar">
      <div class="topbar-left">
        <a class="back-link" href="../">&larr; Main Shell</a>
        <div class="sheet-title-wrap">
          <h1 class="sheet-title">Sheet 03 &middot; Spaced Twin-Park Plan (2D)</h1>
          <span class="sheet-subtitle">179 Plots &middot; 60.74% Plotted &middot; 14.55% Park &middot; 24.70% Road</span>
        </div>
      </div>

      <div class="topbar-controls">
        <div class="filter-strip" role="group" aria-label="Plot orientation filters">
          <button type="button" class="flt-btn is-active" data-filter="all">All (179)</button>
          <button type="button" class="flt-btn" data-filter="ne">NE 38&deg; (18)</button>
          <button type="button" class="flt-btn" data-filter="nw">NW 308&deg; (81)</button>
          <button type="button" class="flt-btn" data-filter="ese">ESE 128&deg; (80)</button>
          <button type="button" class="flt-btn" data-filter="corner">Corners (31)</button>
        </div>

        <div class="top-search">
          <input type="text" id="plot-search-input" class="search-input" placeholder="Find P-001.." aria-label="Find plot by ID" />
          <button type="button" id="plot-search-btn" class="search-go">Go</button>
        </div>

        <div class="zoom-group" role="group" aria-label="Drawing zoom controls">
          <button type="button" class="tool-btn" id="zoom-out-btn" title="Zoom out">&minus;</button>
          <button type="button" class="tool-btn" id="zoom-fit-btn" title="Fit drawing">Fit</button>
          <button type="button" class="tool-btn" id="view-toggle-btn" title="Toggle Colony / Full Drawing Sheet">Sheet</button>
          <button type="button" class="tool-btn" id="zoom-in-btn" title="Zoom in">+</button>
        </div>

        <button type="button" class="action-btn" id="export-svg-btn"><span class="hide-xs">Export </span>SVG</button>
      </div>
    </header>

    <div class="stage-pane" id="stage-pane">
      <div class="sheet-frame">
        <svg id="cad-svg" xmlns="http://www.w3.org/2000/svg" viewBox="-75 -78 1035 896" preserveAspectRatio="xMidYMid meet">
          <defs>
            <pattern id="minor-grid" width="25" height="25" patternUnits="userSpaceOnUse">
              <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e9efec" stroke-width="0.4" />
            </pattern>
            <pattern id="major-grid" width="100" height="100" patternUnits="userSpaceOnUse">
              <rect width="100" height="100" fill="url(#minor-grid)" />
              <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#d5e0da" stroke-width="0.7" />
            </pattern>
            <pattern id="closed-wall-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">

      }
      window.addEventListener('pointerup', (e) => endPointer(e, false));
      window.addEventListener('pointercancel', (e) => endPointer(e, true));

      function setFields(title, badgeText, badgeClass, fields, note) {
        document.getElementById('sel-title').textContent = title;
        const badgeEl = document.getElementById('sel-badge');
        badgeEl.textContent = badgeText;
        badgeEl.className = `insp-tag ${badgeClass}`;
        fields.forEach(([k, v], i) => {
          document.getElementById(`lbl-${i + 1}`).textContent = k;
          document.getElementById(`val-${i + 1}`).textContent = v;
        });
        document.getElementById('sel-note').textContent = note;
        detailCard.classList.remove('is-hidden');
        hasSelection = true;
        applyViewBox();
      }

      function clearSelection() {
        plotNodes.forEach(n => n.classList.remove('is-selected'));
        parkNodes.forEach(n => n.classList.remove('is-selected'));
        roadNodes.forEach(n => n.classList.remove('is-selected'));
        detailCard.classList.add('is-hidden');
        hasSelection = false;
        applyViewBox();
      }

      function selectFeature(kind, id, panTo) {
        plotNodes.forEach(n => n.classList.toggle('is-selected', kind === 'plot' && n.dataset.id === id));
        parkNodes.forEach(n => n.classList.toggle('is-selected', kind === 'park' && n.dataset.id === id));
        roadNodes.forEach(n => n.classList.toggle('is-selected', kind === 'road' && n.dataset.id === id));

        if (kind === 'plot') {
          const p = plotsById.get(id);
          if (!p) return;
          const azMap = { NE: '38° NE', NW: '308° NW', ESE: '128° ESE' };
          const badgeCls = p.facing === 'ESE' ? 'insp-tag--ese' : (p.facing === 'NW' ? 'insp-tag--nw' : 'insp-tag--ok');
          const on12m = p.facing === 'NE' || p.block === 'W-05S-C' || (p.block === 'K-E' && p.cx < 232);
          setFields(
            `Plot ${p.id}`,
            p.corner ? 'Corner Plot' : 'Standard Plot',
            badgeCls,
            [
              ['Area (Gaj)', `${p.area_gaj.toFixed(1)} Gaj`],
              ['Area (Sq.ft)', `${Math.round(p.area_sqft).toLocaleString('en-IN')} Sq.ft`],
              ['Dimensions', p.dim_str],
              ['Facing', azMap[p.facing] || p.facing],
              ['Sector Block', `Block ${p.block}`],
              ['Access Road', on12m ? '12.00 m Blvd' : '9.00 m Street'],
            ],
            `Frontage ${p.front.toFixed(1)}' (>= 23.0' min) · Zero South/SW exposure.`
          );
          if (panTo) {
            const home = getHomeVB();
            vb.w = 240;
            vb.h = vb.w * (home.h / home.w);
            vb.x = p.cx - vb.w * 0.5;
            vb.y = p.cy - vb.h * (window.innerWidth <= 720 ? 0.34 : 0.5);
            userMovedView = true;
            applyViewBox();
          }
          return;
        }

        if (kind === 'park') {
          const pk = parksById.get(id);
          if (!pk) return;
          setFields(
            `${pk.id} · ${pk.name}`,
            `${pk.pct.toFixed(2)}% Share`,
            'insp-tag--ok',
            [
              ['Area (Gaj)', `${Math.round(pk.area_gaj).toLocaleString('en-IN')} Gaj`],
              ['Area (Sq.ft)', `${Math.round(pk.area_sqft).toLocaleString('en-IN')} Sq.ft`],
              ['Footprint', pk.footprint],
              ['Sector', pk.sector],
              ['Design Role', pk.purpose],
              ['Frontage Roads', pk.frontage],
            ],
            `Total colony park = ${DATA.summary.park_pct.toFixed(2)}% · PK-02 & PK-03 spaced ${DATA.summary.park_sep_ft} ft apart.`
          );
          return;
        }

        if (kind === 'road') {
          const rd = roadsById.get(id);
          if (!rd) return;
          setFields(
            rd.name,
            `${rd.width_m.toFixed(0)}.00 m Width`,
            'insp-tag--road',
            [
              ['Road Width', `${rd.width_m.toFixed(2)} m (${rd.width_ft}')`],
              ['Length', `${rd.length_ft} ft`],
              ['Area (Sq.ft)', `${Math.round(rd.area_sqft).toLocaleString('en-IN')} Sq.ft`],
              ['Area (Gaj)', `${Math.round(rd.area_gaj).toLocaleString('en-IN')} Gaj`],
              ['Site Share', `${rd.pct.toFixed(2)}% of Site`],
              ['Role', rd.role],
            ],
            `Serves: ${rd.connects}.`
          );
        }
      }

      plotNodes.forEach(node => {
        node.addEventListener('click', (e) => {
          if (svg.classList.contains('is-panning')) return;
          e.stopPropagation();
          selectFeature('plot', node.dataset.id, false);
        });
        node.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectFeature('plot', node.dataset.id, true);
          }
        });
      });

      parkNodes.forEach(node => {
        node.addEventListener('click', (e) => {
          if (svg.classList.contains('is-panning')) return;
          e.stopPropagation();
          selectFeature('park', node.dataset.id, false);
        });
        node.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectFeature('park', node.dataset.id, false);
          }
        });
      });

      roadNodes.forEach(node => {
        node.addEventListener('click', (e) => {
          if (svg.classList.contains('is-panning')) return;
          e.stopPropagation();
          selectFeature('road', node.dataset.id, false);
        });
        node.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectFeature('road', node.dataset.id, false);
          }
        });
      });

      closeDetailBtn.addEventListener('click', clearSelection);
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && hasSelection) clearSelection();
      });

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const flt = btn.dataset.filter;
          filterBtns.forEach(b => b.classList.toggle('is-active', b === btn));
          plotNodes.forEach(n => {
            let match = true;
            if (flt === 'ne') match = n.dataset.facing === 'NE';
            else if (flt === 'nw') match = n.dataset.facing === 'NW';
            else if (flt === 'ese') match = n.dataset.facing === 'ESE';
            else if (flt === 'corner') match = n.dataset.corner === '1';
            n.classList.toggle('is-dimmed', !match);
          });
        });
      });

      function runSearch() {
        const raw = searchInput.value.trim().toUpperCase();
        if (!raw) return;
        let normalized = raw;
        if (/^\d{1,3}$/.test(raw)) {
          normalized = `P-${raw.padStart(3, '0')}`;
        } else if (/^P\d{1,3}$/.test(raw)) {
          normalized = `P-${raw.slice(1).padStart(3, '0')}`;
        }
        if (plotsById.has(normalized)) {
          selectFeature('plot', normalized, true);
        } else {
          readout.textContent = `No plot "${searchInput.value}" · Try P-001..P-${DATA.summary.plot_count}`;
        }
      }
      searchBtn.addEventListener('click', runSearch);
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') runSearch();
      });

      document.getElementById('export-svg-btn').addEventListener('click', () => {
        const clone = svg.cloneNode(true);
        clone.setAttribute('viewBox', `${FULL_VB.x} ${FULL_VB.y} ${FULL_VB.w} ${FULL_VB.h}`);
        const blob = new Blob([new XMLSerializer().serializeToString(clone)], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'colony-2-sheet-03-2d.svg';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });
    })();
  </script>
</body>
</html>
