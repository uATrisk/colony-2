<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheet 04 &middot; 12m E&ndash;W Grand Promenade &amp; Diagonal Parks Plan (2D) &mdash; Colony 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #eef2ef;
      --bg-sheet: #ffffff;
      --bg-header: #13221d;
      --bg-header-2: #1c312a;
      --bg-panel: #f7faf8;
      --ink-primary: #13221d;
      --ink-secondary: #3f524a;
      --ink-muted: #61746b;
      --border-hairline: #c7d2cc;
      --border-ink: #1c312a;
      --accent-green: #146c34;
      --accent-green-ink: #0d5226;
      --accent-green-bg: #e8f5ee;
      --accent-ese: #9a5a13;
      --accent-ese-bg: #fbf3e4;
      --accent-nw: #155e75;
      --accent-nw-bg: #e7f2f4;
      --accent-wall: #b83721;
      --font-ui: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Archivo', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 3px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: #146c34; color: #ffffff; }
    :focus-visible { outline: 2px solid #146c34; outline-offset: 2px; }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .cad-topbar {
      background-color: var(--bg-header);
      color: #f4f7f5;
      border-bottom: 1px solid #263d34;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      background: var(--bg-header-2);
      border: 1px solid #3c544b;
      border-radius: var(--radius);
      color: #e6efea;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .back-link:hover { background: #264037; border-color: #6b8e7e; }

    body.is-embedded .back-link,
    body.is-embedded .sheet-title-wrap {
      display: none;
    }

    .sheet-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sheet-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    .sheet-subtitle {
      font-family: var(--font-mono);
      font-size: 11px;
      color: #b7cbc1;
      font-variant-numeric: tabular-nums;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .filter-strip {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .flt-btn {
      height: 28px;
      padding: 0 8px;
      border-radius: var(--radius);
      border: 1px solid #354c43;
      background: #1a2d26;
      color: #d7e4dd;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .flt-btn:hover { background: #243b33; border-color: #5e7e71; }
    .flt-btn.is-active {
      background: var(--accent-green);
      border-color: #34a862;
      color: #ffffff;
      font-weight: 700;
    }
    .flt-btn[data-filter="ese"].is-active {
      background: #9a5a13;
      border-color: #d9822b;
    }
    .flt-btn[data-filter="nw"].is-active {
      background: #155e75;
      border-color: #318ba8;
    }

    .top-search {
      display: inline-flex;
      align-items: center;
      border: 1px solid #354c43;
      border-radius: var(--radius);
      background: #101e19;
      overflow: hidden;
    }
    .search-input {
      width: 96px;
      height: 26px;
      padding: 0 8px;
      border: none;
      background: transparent;
      color: #eef4f0;
      font-family: var(--font-mono);
      font-size: 11px;
      outline: none;
    }
    .search-input::placeholder { color: #7e968a; }
    .search-go {
      height: 26px;
      padding: 0 9px;
      border: none;
      border-left: 1px solid #354c43;
      background: #1c312a;
      color: #d7e4dd;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .search-go:hover { background: #27443a; color: #ffffff; }

    .zoom-group {
      display: inline-flex;
      align-items: center;
      border: 1px solid #354c43;
      border-radius: var(--radius);
      overflow: hidden;
      background: #1a2d26;
    }

    .tool-btn {
      height: 28px;
      padding: 0 8px;
      border: none;
      border-right: 1px solid #354c43;
      background: transparent;
      color: #e4ede8;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .tool-btn:last-child { border-right: none; }
    .tool-btn:hover { background: #264037; }

    .action-btn {
      height: 28px;
      padding: 0 9px;
      border: 1px solid #3c544b;
      border-radius: var(--radius);
      background: var(--bg-header-2);
      color: #e6efea;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .action-btn:hover { background: #264037; border-color: #6b8e7e; }

    .stage-pane {
      flex: 1;
      min-width: 0;
      min-height: 0;
      position: relative;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(#bcc8c1 1px, transparent 1px);
      background-size: 20px 20px;
      padding: 10px;
      display: flex;
      align-items: stretch;
      justify-content: center;
      overflow: hidden;
    }

    .sheet-frame {
      width: 100%;
      height: 100%;
      background-color: var(--bg-sheet);
      border: 1px solid var(--border-ink);
      border-radius: var(--radius);
      box-shadow: 0 2px 10px rgba(19, 34, 29, 0.08);
      position: relative;
      overflow: hidden;
    }

    #cad-svg {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    #cad-svg.is-panning { cursor: grabbing; }

    .zoom-readout {
      position: absolute;
      left: 10px;
      bottom: 10px;
      background: rgba(19, 34, 29, 0.88);
      color: #eef4f0;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 9px;
      border-radius: var(--radius);
      pointer-events: none;
      font-variant-numeric: tabular-nums;
    }

    /* Floating Contextual Detail Card — hidden by default for a minimal canvas */
    .detail-card {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 296px;
      max-width: calc(100% - 36px);
      background: rgba(247, 250, 248, 0.97);
      border: 1px solid var(--border-ink);
      border-radius: 4px;
      box-shadow: 0 12px 28px rgba(19, 34, 29, 0.16);
      z-index: 25;
      overflow: hidden;
      transition: opacity 0.14s ease, transform 0.14s ease;
    }
    .detail-card.is-hidden {
      display: none;
    }

    .detail-head {
      background: var(--bg-header);
      color: #ffffff;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .detail-head-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .detail-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
    }
    .detail-close {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      border: 1px solid #3c544b;
      border-radius: var(--radius);
      background: #1c312a;
      color: #e6efea;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .detail-close:hover { background: #2c4a3f; color: #ffffff; }

    .detail-body {
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .insp-tag {
      align-self: flex-start;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius);
      font-variant-numeric: tabular-nums;
    }
    .insp-tag--ok { background: #214e39; color: #c7ecd6; border: 1px solid #3b7f5d; }
    .insp-tag--ese { background: #473014; color: #f6dec0; border: 1px solid #8a5b21; }
    .insp-tag--nw { background: #143946; color: #c4e8f2; border: 1px solid #2b6d83; }
    .insp-tag--road { background: #263932; color: #dbe6e0; border: 1px solid #526b61; }

    .spec-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
    }

    .spec-cell {
      padding: 4px 0 6px 0;
      border-bottom: 1px solid #dde6e1;
    }

    .spec-k {
      font-size: 11px;
      color: var(--ink-muted);
      margin-bottom: 2px;
    }

    .spec-v {
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-primary);
      font-variant-numeric: tabular-nums;
    }

    .detail-note {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-secondary);
      padding-top: 4px;
      border-top: 1px dashed #d0dad5;
    }

    /* SVG Interactive Elements */
    .cad-road { cursor: pointer; }
    .road-poly {
      transition: fill 0.12s ease, stroke 0.12s ease;
    }
    .road-poly--main {
      fill: #e2eae5;
      stroke: #9ab0a5;
      stroke-width: 0.6;
    }
    .road-poly--sub {
      fill: #ecf1ee;
      stroke: #b5c5bc;
      stroke-width: 0.5;
    }
    .cad-road:hover .road-poly {
      fill: #d4e3da;
      stroke: #3f6956;
      stroke-width: 1.2;
    }
    .cad-road.is-selected .road-poly {
      fill: #c7ded1;
      stroke: #0d5226;
      stroke-width: 1.8;
    }

    .road-median {
      stroke: #5c786c;
      stroke-width: 0.9;
      stroke-dasharray: 8 6;
      fill: none;
      pointer-events: none;
    }
    .road-lbl {
      font-family: var(--font-mono);
      font-size: 5.7px;
      font-weight: 600;
      fill: #2f463d;
      text-anchor: middle;
      letter-spacing: 0.04em;
      paint-order: stroke;
      stroke: #ecf1ee;
      stroke-width: 5.2px;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .road-lbl--main {
      font-size: 6.3px;
      fill: #13221d;
      font-weight: 700;
      stroke: #e2eae5;
      stroke-width: 5.8px;
    }

    .park-poly {
      fill: #d8f0e1;
      stroke: #247844;
      stroke-width: 1.0;
    }
    .park-walk {
      fill: none;
      stroke: #79b890;
      stroke-width: 0.85;
      stroke-dasharray: 3 2.5;
      pointer-events: none;
    }
    .park-plaza {
      fill: #eef8f1;
      fill-opacity: 0.72;
      stroke: #2d7a4f;
      stroke-width: 0.8;
      pointer-events: none;
    }
    .park-tree-outer {
      fill: #9bd6b1;
      fill-opacity: 0.6;
      stroke: #1f6b3d;
      stroke-width: 0.5;
      pointer-events: none;
    }
    .park-tree-core {
      fill: #146c34;
      pointer-events: none;
    }
    .park-title {
      font-family: var(--font-ui);
      font-size: 7.3px;
      font-weight: 700;
      fill: #0d5226;
      text-anchor: middle;
      paint-order: stroke;
      stroke: #d8f0e1;
      stroke-width: 2.6px;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .park-meta {
      font-family: var(--font-mono);
      font-size: 5.7px;
      font-weight: 600;
      fill: #185c37;
      text-anchor: middle;
      paint-order: stroke;
      stroke: #d8f0e1;
      stroke-width: 2.2px;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .cad-park { cursor: pointer; }
    .cad-park:hover .park-poly,
    .cad-park.is-selected .park-poly {
      stroke: #0d5226;
      stroke-width: 2.1;
      fill: #cbead6;
    }

    .cad-plot {
      cursor: pointer;
      transition: opacity 0.14s ease;
    }
    .cad-plot.is-dimmed { opacity: 0.14; }
    .plot-poly { stroke-width: 0.68; }
    .plot-face--ne .plot-poly { fill: #e8f5ee; stroke: #2c7a4b; }
    .plot-face--nw .plot-poly { fill: #e7f2f4; stroke: #246a7d; }
    .plot-face--ese .plot-poly { fill: #fbf3e4; stroke: #a6691e; }
    .cad-plot.is-corner .plot-poly { stroke-width: 0.95; }

    .plot-front-chevron {
      opacity: 0.55;
      pointer-events: none;
    }
    .plot-face--ne .plot-front-chevron { fill: #146c34; }
    .plot-face--nw .plot-front-chevron { fill: #155e75; }
    .plot-face--ese .plot-front-chevron { fill: #9a5a13; }

    .cad-plot:hover .plot-poly {
      stroke-width: 1.8;
      filter: brightness(0.95);
    }
    .cad-plot.is-selected .plot-poly {
      stroke: #13221d;
      stroke-width: 2.4;
      fill: #d2ece0;
    }
    .plot-face--ese.is-selected .plot-poly { fill: #f5dfb8; }
    .plot-face--nw.is-selected .plot-poly { fill: #cde6ec; }

    .plot-lbl { pointer-events: none; }
    .pl-id {
      font-family: var(--font-mono);
      font-size: 5.5px;
      font-weight: 700;
      fill: #13221d;
      text-anchor: middle;
    }
    .pl-gaj {
      font-family: var(--font-mono);
      font-size: 4.5px;
      font-weight: 600;
      fill: #1d3c31;
      text-anchor: middle;
    }
    .pl-dim {
      font-family: var(--font-mono);
      font-size: 3.7px;
      font-weight: 500;
      fill: #475f55;
      text-anchor: middle;
    }

    /* Outer Boundary & Walls */
    .outer-boundary-line {
      fill: none;
      stroke: #13221d;
      stroke-width: 2.2;
      pointer-events: none;
    }
    .wall-barrier {
      fill: none;
      stroke: var(--accent-wall);
      stroke-width: 3.4;
      pointer-events: none;
    }
    .wall-hatch-band {
      fill: url(#closed-wall-hatch);
      opacity: 0.85;
      pointer-events: none;
    }
    .gate-threshold {
      fill: #ecfdf5;
      stroke: #146c34;
      stroke-width: 1.6;
      pointer-events: none;
    }

    .dim-txt {
      font-family: var(--font-mono);
      font-size: 8.5px;
      font-weight: 600;
      fill: #13221d;
      text-anchor: middle;
    }
    .wall-txt {
      font-family: var(--font-mono);
      font-size: 7.4px;
      font-weight: 700;
      fill: #b83721;
      text-anchor: middle;
    }
    .zone-txt {
      font-family: var(--font-mono);
      font-size: 6.6px;
      font-weight: 700;
      fill: #1d4ed8;
      text-anchor: middle;
    }
    .corner-pin-circle { fill: #ffffff; stroke: #13221d; stroke-width: 1.2; }
    .corner-pin-txt {
      font-family: var(--font-mono);
      font-size: 6.5px;
      font-weight: 700;
      fill: #13221d;
      text-anchor: middle;
      dominant-baseline: central;
    }

    @media (max-width: 720px) {
      .sheet-subtitle { display: none; }
      .stage-pane { padding: 6px; }
      .detail-card {
        top: auto;
        right: 8px;
        left: 8px;
        bottom: 8px;
        width: auto;
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="cad-topbar">
      <div class="topbar-left">
        <a class="back-link" href="../">&larr; Main Shell</a>
        <div class="sheet-title-wrap">
          <h1 class="sheet-title">Sheet 04 &middot; 12m Grand E&ndash;W Promenade Plan (2D)</h1>
          <span class="sheet-subtitle">182 Plots &middot; 61.43% Plotted &middot; 13.80% Park &middot; 24.76% Road</span>
        </div>
      </div>

      <div class="topbar-controls">
        <div class="filter-strip" role="group" aria-label="Plot orientation filters">
          <button type="button" class="flt-btn is-active" data-filter="all">All (182)</button>
          <button type="button" class="flt-btn" data-filter="ne">NE 38&deg; (12)</button>
          <button type="button" class="flt-btn" data-filter="nw">NW 308&deg; (87)</button>
          <button type="button" class="flt-btn" data-filter="ese">ESE 128&deg; (83)</button>
          <button type="button" class="flt-btn" data-filter="corner">Corners (15)</button>
        </div>

        <div class="top-search">
          <input type="text" id="plot-search-input" class="search-input" placeholder="Find P-001.." aria-label="Find plot by ID" />
          <button type="button" id="plot-search-btn" class="search-go">Go</button>
        </div>

        <div class="zoom-group" role="group" aria-label="Drawing zoom controls">
          <button type="button" class="tool-btn" id="zoom-out-btn" title="Zoom out">&minus;</button>
          <button type="button" class="tool-btn" id="zoom-fit-btn" title="Fit whole sheet">Fit</button>
          <button type="button" class="tool-btn" id="zoom-in-btn" title="Zoom in">+</button>
        </div>

        <button type="button" class="action-btn" id="export-svg-btn">Export SVG</button>
      </div>
    </header>

    <div class="stage-pane" id="stage-pane">
      <div class="sheet-frame">
        <svg id="cad-svg" xmlns="http://www.w3.org/2000/svg" viewBox="-75 -78 1035 896" preserveAspectRatio="xMidYMid meet">
          <defs>
            <pattern id="minor-grid" width="25" height="25" patternUnits="userSpaceOnUse">
              <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e9efec" stroke-width="0.4" />
            </pattern>
            <pattern id="major-grid" width="100" height="100" patternUnits="userSpaceOnUse">
              <rect width="100" height="100" fill="url(#minor-grid)" />
              <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#d5e0da" stroke-width="0.7" />
            </pattern>
            <pattern id="closed-wall-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
              <line x1="0" y1="0" x2="0" y2="8" stroke="#b83721" stroke-width="1.6" />
            </pattern>
            <pattern id="road-hatch" width="14" height="14" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
              <line x1="0" y1="0" x2="0" y2="14" stroke="#cbd5cf" stroke-width="1.2" />
            </pattern>
          </defs>

          <rect x="-75" y="-78" width="1035" height="896" fill="#ffffff" data-bg="1" />
          <rect x="-15" y="-15" width="690" height="750" fill="url(#major-grid)" data-bg="1" />

          <g id="sheet-banner">
            <text x="0" y="-48" font-family="Archivo, sans-serif" font-size="13.5" font-weight="700" fill="#13221d">COLONY SUBDIVISION &middot; 12m GRAND E&ndash;W PROMENADE &amp; DIAGONAL PARKS PLAN (2D)</text>
            <text x="0" y="-33" font-family="JetBrains Mono, monospace" font-size="7.5" font-weight="500" fill="#52675e">PK-02 NORTH (2.91%) + PK-03 SW GATE WELCOME (5.86%) [492&prime; APART] + PK-01 EAST CUT (5.03%) = 13.80% &middot; GATE 78&prime;&ndash;117.4&prime;</text>
          </g>

          <!-- External Road Context (Verbatim Locked Site Perimeter) -->
          <g id="external-roads">
            <polygon points="461.54,0 503.54,0 684.65,681.50 642.65,681.50" fill="url(#road-hatch)" stroke="#9eb0a6" stroke-width="0.7" data-bg="1" />

 410.76, "cy": 668.02, "band": "Band 6N \u00b7 Karodi Gate Tier", "facing": "NW", "facing_deg": "308\u00b0 NW", "road": "Street 5 (9.00m)", "front_ft": 24.28, "depth_ft": 53.02, "area_sqft": 1288.6, "area_gaj": 143.18, "corner": false, "park_facing": false, "shape": "trap", "type": "Residential Plot", "dim_str": "24.3'\u00d753.0'"}, {"id": "P-177", "cx": 435.23, "cy": 667.64, "band": "Band 6N \u00b7 Karodi Gate Tier", "facing": "NW", "facing_deg": "308\u00b0 NW", "road": "Street 5 (9.00m)", "front_ft": 24.69, "depth_ft": 52.32, "area_sqft": 1291.9, "area_gaj": 143.54, "corner": false, "park_facing": false, "shape": "trap", "type": "Residential Plot", "dim_str": "24.7'\u00d752.3'"}, {"id": "P-178", "cx": 460.13, "cy": 667.2, "band": "Band 6N \u00b7 Karodi Gate Tier", "facing": "NW", "facing_deg": "308\u00b0 NW", "road": "Street 5 (9.00m)", "front_ft": 25.11, "depth_ft": 51.43, "area_sqft": 1291.41, "area_gaj": 143.49, "corner": false, "park_facing": false, "shape": "trap", "type": "Residential Plot", "dim_str": "25.1'\u00d751.4'"}, {"id": "P-179", "cx": 485.46, "cy": 666.74, "band": "Band 6N \u00b7 Karodi Gate Tier", "facing": "NW", "facing_deg": "308\u00b0 NW", "road": "Street 5 (9.00m)", "front_ft": 25.54, "depth_ft": 50.52, "area_sqft": 1290.91, "area_gaj": 143.43, "corner": false, "park_facing": false, "shape": "trap", "type": "Residential Plot", "dim_str": "25.5'\u00d750.5'"}, {"id": "P-180", "cx": 511.22, "cy": 666.28, "band": "Band 6N \u00b7 Karodi Gate Tier", "facing": "NW", "facing_deg": "308\u00b0 NW", "road": "Street 5 (9.00m)", "front_ft": 25.99, "depth_ft": 49.6, "area_sqft": 1289.1, "area_gaj": 143.23, "corner": false, "park_facing": false, "shape": "trap", "type": "Residential Plot", "dim_str": "26.0'\u00d749.6'"}, {"id": "P-181", "cx": 537.45, "cy": 665.81, "band": "Band 6N \u00b7 Karodi Gate Tier", "facing": "NW", "facing_deg": "308\u00b0 NW", "road": "Street 5 (9.00m)", "front_ft": 26.46, "depth_ft": 48.66, "area_sqft": 1287.41, "area_gaj": 143.05, "corner": false, "park_facing": false, "shape": "trap", "type": "Residential Plot", "dim_str": "26.5'\u00d748.7'"}, {"id": "P-182", "cx": 564.25, "cy": 665.07, "band": "Band 6N \u00b7 Karodi Gate Tier", "facing": "NW", "facing_deg": "308\u00b0 NW", "road": "Street 5 (9.00m)", "front_ft": 27.28, "depth_ft": 47.06, "area_sqft": 1286.73, "area_gaj": 142.97, "corner": false, "park_facing": false, "shape": "trap", "type": "Residential Plot", "dim_str": "27.3'\u00d747.1'"}]}</script>
  <script>
    (() => {
      if (window.self !== window.top) {
        document.body.classList.add('is-embedded');
      }

      const DATA = JSON.parse(document.getElementById('sheet4-data').textContent);
      const plotsById = new Map(DATA.plots.map(p => [p.id, p]));
      const parksById = new Map(DATA.parks.map(pk => [pk.id, pk]));
      const roadsById = new Map(DATA.roads.map(rd => [rd.id, rd]));

      const svg = document.getElementById('cad-svg');
      const readout = document.getElementById('zoom-readout');
      const detailCard = document.getElementById('detail-card');
      const closeDetailBtn = document.getElementById('detail-close-btn');
      const searchInput = document.getElementById('plot-search-input');
      const searchBtn = document.getElementById('plot-search-btn');
      const plotNodes = Array.from(document.querySelectorAll('.cad-plot'));
      const parkNodes = Array.from(document.querySelectorAll('.cad-park'));
      const roadNodes = Array.from(document.querySelectorAll('.cad-road'));
      const filterBtns = Array.from(document.querySelectorAll('.flt-btn'));

      const HOME_VB = { x: -75, y: -78, w: 1035, h: 896 };
      let vb = { ...HOME_VB };
      let hasSelection = false;

      function applyViewBox() {
        svg.setAttribute('viewBox', `${vb.x.toFixed(2)} ${vb.y.toFixed(2)} ${vb.w.toFixed(2)} ${vb.h.toFixed(2)}`);
        const pct = Math.round((HOME_VB.w / vb.w) * 100);
        readout.textContent = hasSelection
          ? `${pct}% · Esc or click canvas to close details`
          : `${pct}% · Click any plot, road, or park for details`;
      }

      function zoomAt(factor, clientX, clientY) {
        const rect = svg.getBoundingClientRect();
        const fx = (clientX - rect.left) / rect.width;
        const fy = (clientY - rect.top) / rect.height;
        const nextW = Math.min(1800, Math.max(120, vb.w * factor));
        const nextH = nextW * (HOME_VB.h / HOME_VB.w);
        vb.x += (vb.w - nextW) * fx;
        vb.y += (vb.h - nextH) * fy;
        vb.w = nextW;
        vb.h = nextH;
        applyViewBox();
      }

      document.getElementById('zoom-in-btn').addEventListener('click', () => {
        const r = svg.getBoundingClientRect();
        zoomAt(0.75, r.left + r.width / 2, r.top + r.height / 2);
      });
      document.getElementById('zoom-out-btn').addEventListener('click', () => {
        const r = svg.getBoundingClientRect();
        zoomAt(1.33, r.left + r.width / 2, r.top + r.height / 2);
      });
      document.getElementById('zoom-fit-btn').addEventListener('click', () => {
        vb = { ...HOME_VB };
        applyViewBox();
      });

      svg.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomAt(e.deltaY > 0 ? 1.15 : 0.87, e.clientX, e.clientY);
      }, { passive: false });

      let drag = null;
      svg.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        drag = { startX: e.clientX, startY: e.clientY, origX: vb.x, origY: vb.y, moved: false };
      });
      window.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const rect = svg.getBoundingClientRect();
        const dxPx = e.clientX - drag.startX;
        const dyPx = e.clientY - drag.startY;
        if (!drag.moved && Math.hypot(dxPx, dyPx) < 4) return;
        drag.moved = true;
        svg.classList.add('is-panning');
        const scale = Math.max(vb.w / rect.width, vb.h / rect.height);
        vb.x = drag.origX - dxPx * scale;
        vb.y = drag.origY - dyPx * scale;
        applyViewBox();
      });
      window.addEventListener('pointerup', (e) => {
        const wasDrag = drag && drag.moved;
        if (wasDrag) {
          setTimeout(() => { svg.classList.remove('is-panning'); }, 20);
        } else if (drag && !wasDrag) {
          const hitInteractive = e.target && e.target.closest && e.target.closest('[data-kind]');
          if (!hitInteractive && svg.contains(e.target) && hasSelection) {
            clearSelection();
          }
        }
        drag = null;
      });

      function setFields(title, badgeText, badgeClass, fields, note) {
        document.getElementById('sel-title').textContent = title;
        const badgeEl = document.getElementById('sel-badge');
        badgeEl.textContent = badgeText;
        badgeEl.className = `insp-tag ${badgeClass}`;
        fields.forEach(([k, v], i) => {
          document.getElementById(`lbl-${i + 1}`).textContent = k;
          document.getElementById(`val-${i + 1}`).textContent = v;
        });
        document.getElementById('sel-note').textContent = note;
        detailCard.classList.remove('is-hidden');
        hasSelection = true;
        applyViewBox();
      }

      function clearSelection() {
        plotNodes.forEach(n => n.classList.remove('is-selected'));
        parkNodes.forEach(n => n.classList.remove('is-selected'));
        roadNodes.forEach(n => n.classList.remove('is-selected'));
        detailCard.classList.add('is-hidden');
        hasSelection = false;
        applyViewBox();
      }

      function selectFeature(kind, id, panTo) {
        plotNodes.forEach(n => n.classList.toggle('is-selected', kind === 'plot' && n.dataset.id === id));
        parkNodes.forEach(n => n.classList.toggle('is-selected', kind === 'park' && n.dataset.id === id));
        roadNodes.forEach(n => n.classList.toggle('is-selected', kind === 'road' && n.dataset.id === id));

        if (kind === 'plot') {
          const p = plotsById.get(id);
          if (!p) return;
          const badgeCls = p.facing === 'ESE' ? 'insp-tag--ese' : (p.facing === 'NW' ? 'insp-tag--nw' : 'insp-tag--ok');
          setFields(
            `Plot ${p.id}`,
            p.corner ? 'Corner Plot' : (p.park_facing ? 'Park View Plot' : 'Standard Plot'),
            badgeCls,
            [
              ['Area (Gaj)', `${p.area_gaj.toFixed(1)} Gaj`],
              ['Area (Sq.ft)', `${Math.round(p.area_sqft).toLocaleString('en-IN')} Sq.ft`],
              ['Dimensions', p.dim_str],
              ['Facing', p.facing_deg],
              ['Sector Band', p.band],
              ['Access Road', p.road],
            ],
            `Frontage ${p.front_ft.toFixed(1)}' (>= 23.0' min) · Zero South/SW exposure.`
          );
          if (panTo) {
            vb.w = 240;
            vb.h = vb.w * (HOME_VB.h / HOME_VB.w);
            vb.x = p.cx - vb.w * 0.5;
            vb.y = p.cy - vb.h * 0.5;
            applyViewBox();
          }
          return;
        }

        if (kind === 'park') {
          const pk = parksById.get(id);
          if (!pk) return;
          setFields(
            `${pk.id} · ${pk.name}`,
            `${pk.pct.toFixed(2)}% Share`,
            'insp-tag--ok',
            [
              ['Area (Gaj)', `${Math.round(pk.area_gaj).toLocaleString('en-IN')} Gaj`],
              ['Area (Sq.ft)', `${Math.round(pk.area_sqft).toLocaleString('en-IN')} Sq.ft`],
              ['Site Share', `${pk.pct.toFixed(2)}%`],
              ['Design Role', pk.role],
              ['Access Streets', pk.access],
              ['Spacing Rule', `${DATA.summary.pk_sep_2_3_ft} ft apart`],
            ],
            `Total colony park = ${DATA.summary.park_pct.toFixed(2)}% · PK-02 & PK-03 spaced ${DATA.summary.pk_sep_2_3_ft} ft apart.`
          );
          return;
        }

        if (kind === 'road') {
          const rd = roadsById.get(id);
          if (!rd) return;
          setFields(
            rd.name,
            `${rd.width_m} Width`,
            'insp-tag--road',
            [
              ['Road Width', `${rd.width_m} (${rd.width_ft}')`],
              ['Run Length', rd.length_label],
              ['Area (Sq.ft)', `${Math.round(rd.area_sqft).toLocaleString('en-IN')} Sq.ft`],
              ['Area (Gaj)', `${Math.round(rd.area_gaj).toLocaleString('en-IN')} Gaj`],
              ['Site Share', `${rd.pct.toFixed(2)}% of Site`],
              ['Road ID', rd.id],
            ],
            `Function: ${rd.role}.`
          );
        }
      }

      plotNodes.forEach(node => {
        node.addEventListener('click', (e) => {
          if (svg.classList.contains('is-panning')) return;
          e.stopPropagation();
          selectFeature('plot', node.dataset.id, false);
        });
        node.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectFeature('plot', node.dataset.id, true);
          }
        });
      });

      parkNodes.forEach(node => {
        node.addEventListener('click', (e) => {
          if (svg.classList.contains('is-panning')) return;
          e.stopPropagation();
          selectFeature('park', node.dataset.id, false);
        });
        node.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectFeature('park', node.dataset.id, false);
          }
        });
      });

      roadNodes.forEach(node => {
        node.addEventListener('click', (e) => {
          if (svg.classList.contains('is-panning')) return;
          e.stopPropagation();
          selectFeature('road', node.dataset.id, false);
        });
        node.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectFeature('road', node.dataset.id, false);
          }
        });
      });

      closeDetailBtn.addEventListener('click', clearSelection);
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && hasSelection) clearSelection();
      });

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const flt = btn.dataset.filter;
          filterBtns.forEach(b => b.classList.toggle('is-active', b === btn));
          plotNodes.forEach(n => {
            let match = true;
            if (flt === 'ne') match = n.dataset.facing === 'NE';
            else if (flt === 'nw') match = n.dataset.facing === 'NW';
            else if (flt === 'ese') match = n.dataset.facing === 'ESE';
            else if (flt === 'corner') match = n.dataset.corner === '1';
            n.classList.toggle('is-dimmed', !match);
          });
        });
      });

      function runSearch() {
        const raw = searchInput.value.trim().toUpperCase();
        if (!raw) return;
        let normalized = raw;
        if (/^\d{1,3}$/.test(raw)) {
          normalized = `P-${raw.padStart(3, '0')}`;
        } else if (/^P\d{1,3}$/.test(raw)) {
          normalized = `P-${raw.slice(1).padStart(3, '0')}`;
        }
        if (plotsById.has(normalized)) {
          selectFeature('plot', normalized, true);
        } else {
          readout.textContent = `No plot "${searchInput.value}" · Try P-001..P-${DATA.summary.plot_count}`;
        }
      }
      searchBtn.addEventListener('click', runSearch);
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') runSearch();
      });

      document.getElementById('export-svg-btn').addEventListener('click', () => {
        const clone = svg.cloneNode(true);
        clone.setAttribute('viewBox', `${HOME_VB.x} ${HOME_VB.y} ${HOME_VB.w} ${HOME_VB.h}`);
        const blob = new Blob([new XMLSerializer().serializeToString(clone)], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'colony-2-sheet-04-2d.svg';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });
    })();
  </script>
